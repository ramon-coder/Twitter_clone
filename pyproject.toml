# Ruff Linter Configuration
# See: https://docs.astral.sh/ruff/

[lint]
# Enable Pyflakes, FISA (flake8-implicit-str-concat), and various other checks
select = ["E", "F", "W", "I", "N", "UP", "YTT", "BLE", "A", "C4", "T10", "ISC", "ICN", "PIE", "T20", "SIM", "ARG", "PL", "RUF", "G", "B", "A001", "PLC", "PLE", "PLR", "PLW"]

# Ignore specific rules
ignore = [
    "E501",  # Line too long (handled by formatter)
    "F401",  # Module imported but unused (will be caught by pyflakes)
    "PLR0913",  # Too many arguments to function call
    "PLR0912",  # Too many returns
    "PLR0915",  # Too many statements
    "PLR2004",  # Magic value used in comparison
    "PLW2901",  # Rewrite loop variable
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|_+[a-zA-Z0-9]*)$"

# Exclude specific files/directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "alembic/versions/*.py",
    "migrations/*.py",
]

# Same as Black.
line-length = 88

# Allow Python 3.9+
target-version = "py39"

[lint.isort]
# Same as Black.
known-first-party = ["models", "routers", "services", "middleware", "tests"]

[lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"alembic/versions/*.py" = ["ALL"]

[lint.pydocstyle]
convention = "google"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
